<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XB Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #026374, #ffffff); 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-container {
            background: linear-gradient(to bottom, #ffffff, #026374);
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .success-container h2 {
            font-size: 30px;
            color: #333; 
            margin-bottom: 30px;
        }

        .success-container p {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #026374;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.3s;
        }

        .home-btn:hover {
            background-color: #05a3bf;
            transform: translateY(-2px);
        }
        .home-btn:active{
            background-color: #012c2e;
            transform: translateY(-2px);
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: block;
            stroke-width: 3;
            stroke: #026374;
            stroke-miterlimit: 10;
            margin: 0 auto 20px;
            box-shadow: inset 0px 0px 0px #ffffff; 
            /*تسريع الحركة */
            animation: fill 0.3s ease-in-out 0.4s forwards, scale 0.2s ease-in-out 0.7s both; 
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: #026374;
            fill: none;
            /*تسريع حركة الرسم*/
            animation: stroke 0.4s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            /*اتسريع حركة الرسم والبدء في وقت اسرع*/
            animation: stroke 0.2s cubic-bezier(0.65, 0, 0.45, 1) 0.7s forwards; 
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fill {
            100% {
                /*ملء الدائرة باللون الابيض*/
                box-shadow: inset 0px 0px 0px 60px #ffffff; 
            }
        }

        @keyframes scale {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="check-animation">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>
        
        <h2>The request has been sent</h2>
        <p>
           <i style="font-weight: bold;">Your request has been successfully sent to XB Food
            <br>
            Delivery will be as soon as possible
            </i>
        </p>

        <a href="index.html" class="home-btn">Go to Home Page</a>
    </div>
</body>
</html>
