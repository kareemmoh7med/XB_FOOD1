    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            /* تم تحديث لون الخلفية والألوان لتبدو أفضل مع البطاقات البيضاء */
            background-image:url("8d2bf219-e3bb-4b36-9198-e7402646f8c7.jpeg"); 
            color: #333;
            direction: ltr;
            text-align: left;
        }

        /* Page Header */
        .page-header {
            background-color:#e17d7d; /* لون أزرق موحد */
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .page-header h1 {
            margin: 0;
        }

        /* Profiles Container (Flexbox for responsive layout) */
        .profiles-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }

        /* Profile Card */
        .profile-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 300px;
            max-width: calc(33.333% - 20px);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* Profile Image */
        .profile-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        /* Profile Details */
        .profile-details {
            padding: 20px;
        }

        .profile-details h2 { /* Name heading */
            color: #007bff;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .profile-details p {
            margin: 5px 0;
            line-height: 1.6;
            font-size: 16px;
        }

        .profile-details strong {
            font-weight: bold;
            color: #555;
        }

        /* Social Links (Icon Buttons) */
        .social-links {
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .social-links a {
            text-decoration: none;
            padding: 10px;
            border-radius: 50%; /* Makes buttons round */
            color: white;
            font-size: 18px;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px; 
            height: 40px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .social-links a:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Specific Social Media Colors */
        .social-links .facebook {
            background-color: #3b5998;
        }

        .social-links .instagram {
            background-color: #d68493;
            background-image: linear-gradient(45deg, #f09433 0%, #e66846 25%, #d62261 50%, #af23a6 75%, #5851db 100%);
        }

        .social-links .linkedin {
            background-color: #0077b5;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .profile-card {
                width: calc(50% - 20px);
                max-width: 450px;
            }
        }
        @media (max-width: 600px) {
            .profile-card {
                width: 90%;
                max-width: 400px;
            }
        }
    </style>
